# Log size limit for every container, so logs can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/platform.db
      FAL_KEY: ${FAL_KEY:-}
      PORT: 4000
    volumes:
      - ./data:/data        # the SQLite database lives here. Back up this folder.
    expose:
      - "4000"
    healthcheck:
      # /health is public and runs a real query against the database.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Localhost only: nginx on the same server reaches it, the internet can't.
      # WEB_PORT has no default on purpose. On a shared server a silent fallback
      # to 3000 would grab another app's port, so it must be set in .env.
      - "127.0.0.1:${WEB_PORT:?set WEB_PORT in .env}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
